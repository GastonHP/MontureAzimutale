; PlatformIO Project Configuration File
;
;   Build options: build flags, source filter
;   Upload options: custom upload port, speed and extra flags
;   Library options: dependencies, extra library storages
;   Advanced options: extra scripting
;
; Please visit documentation for the other options and examples
; https://docs.platformio.org/page/projectconf.html

[platformio]
workspace_dir = d:\tmp\pio\pio_monture\test ;monture\
lib_dir = ../../../lib/lib

[env]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  -D GMT024
	-D SERIAL_SPEED=115200
	-D FTPPath=\"monture/test/espnow\"
	-D SID=\"espnow\"
	-D nomDevice=\"monture-test\"		;nom sur réseau = monture-capteurs.local
	-D DeviceId=\"espnowId\"
	;-D ReadDeviceConfigInProject
	
	-D GHFS_ACTIF
	-D OTA_ACTIF
	-D TELNET_ACTIF
	-D ota_password=\"Archiduc\"
	-D ota_port=8266
	-D USE_RGB_LED
	
	-D ASYNCWEBSERVER_REGEX=1
	-D HA_ACTIF
	-D ESPINFOS_ACTIF
	-D LOG_ACTIF
	-D MAX_LOG=2000
	-D LOG_DEBUG
	-D FTP_ACTIF
	-D HORLOGE_ACTIF
	-D CONFIG_ACTIF
	-D SPIFFS_ACTIF

lib_deps = 
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.11.0 
  milesburton/DallasTemperature @ ^4.0.6
  paulstoffregen/Time@^1.6.1
  arduino-libraries/NTPClient @^3.2.1
  gmag11/QuickEspNow @ ^0.8.1
  bblanchon/ArduinoJson@^7.4.2
  adafruit/Adafruit BNO08x@^1.2.5
  lennarthennigs/ESP Telnet @ ^2.3.0

[env:test_ota]
upload_protocol = espota
upload_flags = 
	--port=8266
	--auth=Archiduc
upload_port = 192.168.0.179

build_flags =
  ${env.build_flags}

lib_deps = 
  ${env.lib_deps}
;*********************************************** 

[env:test]
upload_port = COM3
build_flags =
  ${env.build_flags}
lib_deps = 
  ${env.lib_deps}
;*********************************************** 