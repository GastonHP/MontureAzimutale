[platformio]
workspace_dir = d:\tmp\pio\pio_monture
lib_dir = ../lib/lib

;************************************************************************* 
; TESTSprojets principaux :
;    capteurs : attaché au téléscope 
;    commande : module de commande
;*************************************************************************
[prm_ota]
build_flags = 
	-D OTA_ACTIF
	-D ota_password=\"Archiduc\"
	-D ota_port=8266

[prm_config]
build_flags = 
	-D GHFS_ACTIF
	-D TELNET_ACTIF
	-D LOG_ACTIF
	-D MAX_LOG=2000
	-D LOG_DEBUG
	-D FTP_ACTIF
	-D HORLOGE_ACTIF
	-D CONFIG_ACTIF
	-D SPIFFS_ACTIF
lib_deps = 
	bblanchon/ArduinoJson@^7.4.2
	paulstoffregen/Time@^1.6.1
	arduino-libraries/NTPClient @^3.2.1
	lennarthennigs/ESP Telnet @ ^2.3.0

[prm_capteurs]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
; 🛠️ Ajoute cette ligne pour activer la magie du preview automatique :
extra_scripts = pre:Projets/capteurs/scripts/html_to_header.py

build_flags = 
	;-D CORE_DEBUG_LEVEL=3
	-D SERIAL_SPEED=115200
	-D FTPPath=\"monture/capteurs\"
	-D SID=\"bno085\"
	-D nomDevice=\"monture-capteurs\"		;nom sur réseau = monture-capteurs.local
	-D DeviceId=\"bno085Id\"
	-D USE_RGB_LED
	-D ASYNCWEBSERVER_REGEX=1
	-D HA_ACTIF
	-D ESPINFOS_ACTIF	
	-D ASTRONOMY_ENGINE_WHOLE_SECOND
lib_deps = 
	ottowinter/ESPAsyncWebServer-esphome @ ^3.4.0
    adafruit/Adafruit BNO08x @ ^1.2.5
	${prm_config.lib_deps}

[env:Capteurs]
extends = prm_capteurs
build_src_filter = +<../Projets/capteurs/src/*.cpp>
build_flags = 
    ${prm_capteurs.build_flags}
	${prm_ota.build_flags}
	${prm_config.build_flags}
    -IProjets/capteurs/include
	
[env:Capteurs_OTA]
extends = prm_capteurs
build_src_filter = +<../Projets/capteurs/src/*.cpp>
build_flags = 
    ${prm_capteurs.build_flags}
    ${prm_ota.build_flags}
	${prm_config.build_flags}
    -IProjets/capteurs/include

upload_protocol = espota
upload_flags = 
	--port=8266
	--auth=Archiduc
upload_port = 192.168.0.171 

[prm_commande]
platform = espressif32
board = mon_esp32-s3-devkitc-1
board_build.arduino.partitions = default_16MB.csv
board_build.arduino.memory_type = qio_opi
board_build.flash_mode = qio
board_build.psram_type = opi
board_upload.flash_size = 16MB
board_upload.maximum_size = 16777216
board_build.extra_flags = -DBOARD_HAS_PSRAM
framework = arduino
monitor_speed = 115200

extra_scripts = pre:Projets/Commande/scripts/html_to_header.py

build_flags = 
	;-D CORE_DEBUG_LEVEL=3
	-D SERIAL_SPEED=115200
	-D FTPPath=\"monture/commande\"
	-D SID=\"monture\"
	-D nomDevice=\"monture-commande\"
	-D DeviceId=\"montureId\"
	-D USE_RGB_LED
	-D ASYNCWEBSERVER_REGEX=1
	-D HA_ACTIF
	-D ESPINFOS_ACTIF
	-D CONFIG_DEBUG	
	-D ASTRONOMY_ENGINE_WHOLE_SECOND
lib_deps = 
	fastled/fastled@3.10.6
	adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
	adafruit/Adafruit BNO08x@^1.2.5
	mikalhart/TinyGPSPlus@^1.1.0
	gin66/FastAccelStepper@^1.2.5
	ottowinter/ESPAsyncWebServer-esphome @ ^3.4.0
	${prm_config.lib_deps}

[env:Commande]
extends = prm_commande
build_src_filter = +<../Projets/commande/src/*.cpp>
build_flags = 
    ${prm_commande.build_flags}
	${prm_ota.build_flags}	
	${prm_config.build_flags}
    -IProjets/commande/include

[env:Commande-OTA]
extends = prm_commande
build_src_filter = +<../Projets/commande/src/*.cpp>
build_flags = 
    ${prm_commande.build_flags}
    ${prm_ota.build_flags}
	${prm_config.build_flags}
    -IProjets/commande/include

upload_protocol = espota
upload_flags = 
	--port=8266
	--auth=Archiduc
upload_port = monture-commande.local

;************************************************************************* 
; TESTS
;    receiver : test de réception des trames udp
;*************************************************************************
[prm_receiver]
platform = espressif32
board = esp32dev
framework = arduino
monitor_speed = 115200
build_flags =
  	-D GMT024
	-D SERIAL_SPEED=115200
	-D FTPPath=\"monture/test/espnow\"
	-D SID=\"espnow\"
	-D nomDevice=\"monture-test\"		;nom sur réseau = monture-capteurs.local
	-D DeviceId=\"espnowId\"
	-D USE_RGB_LED	
	-D ASYNCWEBSERVER_REGEX=1
	-D HA_ACTIF
	-D ESPINFOS_ACTIF

lib_deps = 
  adafruit/Adafruit ST7735 and ST7789 Library@^1.11.0
  adafruit/Adafruit GFX Library@^1.11.0 
  milesburton/DallasTemperature @ ^4.0.6
  adafruit/Adafruit BNO08x@^1.2.5
  ${prm_config.lib_deps}

[env:receiver]
extends = prm_receiver
build_src_filter = +<../Tests/receiver/src/*.cpp>
build_flags = 
    ${prm_receiver.build_flags}
	${prm_ota.build_flags}
	${prm_config.build_flags}
    -ITests/receiver/include

[env:receiver_ota]
extends = prm_receiver
build_src_filter = +<../Tests/receiver/src/*.cpp>
build_flags = 
    ${prm_receiver.build_flags}
	${prm_ota.build_flags}
	${prm_config.build_flags}
    -ITests/receiver/include

upload_protocol = espota
upload_flags = 
	--port=8266
	--auth=Archiduc
upload_port = 192.168.0.179